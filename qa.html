<!doctype html><html lang="vi"><meta charset="utf-8"><title>Kiểm thử responsive</title><style>body{margin:16px;font:14px Arial;background:#ddd}button{padding:12px;margin:3px}iframe{display:block;border:0;background:white}pre{white-space:pre-wrap}</style><h1>Kiểm thử bản nháp</h1><button id="mobile">390 × 844</button><button id="small">320 × 568</button><button id="tablet">768 × 1024</button><button id="desktop">1440 × 900</button><button id="matrix">Chạy ma trận</button><button id="flows">Kiểm tra tương tác</button><button id="axe">Kiểm tra accessibility</button><pre id="result"></pre><iframe id="view" title="Bản thử nghiệm" src="/" width="390" height="844"></iframe><script type="module">
import axe from 'axe-core';
const f=document.querySelector('iframe'),out=document.querySelector('pre');
for(const [id,w,h] of [['mobile',390,844],['small',320,568],['tablet',768,1024],['desktop',1440,900]])document.getElementById(id).onclick=()=>{f.width=w;f.height=h;out.textContent=`${w} × ${h}`;f.src='/'};
const tick=()=>new Promise(r=>setTimeout(r,100));
document.querySelector('#matrix').onclick=async()=>{let results=[];for(const [w,h] of [[320,568],[360,640],[390,844],[430,932],[639,900],[640,900],[641,900],[768,1024],[1023,900],[1024,900],[1025,900],[1280,720],[1440,900],[1920,1080],[2560,1440],[844,390],[1024,768]]){f.width=w;f.height=h;await tick();const d=f.contentDocument;d.querySelector('#replay').click();await tick();const closed=d.documentElement.scrollWidth<=w;d.querySelector('#skip').click();await tick();const open=d.documentElement.scrollWidth<=w;const overflow=[...d.querySelectorAll('.ticket-body,.ticket-stub,.letter-copy,.section,.rsvp')].filter(e=>e.getBoundingClientRect().width&&e.scrollWidth>e.clientWidth+2).map(e=>e.className);results.push({w,h,closed,open,overflow});}out.textContent=JSON.stringify(results,null,2);f.width=390;f.height=844;};
document.querySelector('#axe').onclick=async()=>{out.textContent='Đang chạy axe…';if(!f.contentWindow.axe){const script=f.contentDocument.createElement('script');script.textContent=axe.source;f.contentDocument.head.append(script)}const r=await f.contentWindow.axe.run(f.contentDocument,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21aa']}});out.textContent=JSON.stringify(r.violations.map(v=>({id:v.id,impact:v.impact,nodes:v.nodes.map(n=>({target:n.target,summary:n.failureSummary}))})),null,2)};
document.querySelector('#flows').onclick=async()=>{const d=f.contentDocument,w=f.contentWindow,result=[];const wait=ms=>new Promise(r=>setTimeout(r,ms));d.querySelector('#replay').click();await wait(150);let start=performance.now();d.querySelector('#open-ticket').click();d.querySelector('#open-ticket').click();await wait(2400);result.push({test:'open + repeated click',pass:d.querySelector('#gate').hidden&&!d.querySelector('.paper-scene'),elapsedCheck:Math.round(performance.now()-start)});d.querySelector('#replay').click();d.querySelector('#open-ticket').click();w.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape'}));result.push({test:'Escape',pass:d.querySelector('#gate').hidden&&!d.querySelector('.paper-scene')});d.querySelector('#replay').click();d.querySelector('#open-ticket').click();f.width=430;await wait(800);result.push({test:'resize mid animation',pass:d.querySelector('#gate').hidden&&!d.querySelector('.paper-scene')});d.querySelector('#replay').click();d.querySelector('#open-ticket').click();d.querySelector('#skip').click();result.push({test:'skip mid animation',pass:d.querySelector('#gate').hidden&&!d.querySelector('.paper-scene')});out.textContent=JSON.stringify(result,null,2);};</script></html>
